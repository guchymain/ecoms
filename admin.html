<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere Admin</title>
    <link rel="stylesheet" href="./src/output.css">
    <script defer src="admin.js"></script>
</head>

<body class="bg-black min-h-screen">
    <header class="sticky top-0 z-50 bg-black shadow border-b">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

            <div class="flex items-center gap-3">
                
                <h1 class="text-xl  text-amber-50 font-bold">
                    ShopSphere Admin
                </h1>
            </div>

            <div class="flex gap-3 text-amber-50">

                <a href="./storefront.html"
                   class="px-4 py-2 rounded bg-black hover:bg-gray-700">
                    View Store
                </a>

                <a href="./index.html"
                   class="px-4 py-2 rounded bg-black hover:bg-gray-700">
                    Home
                </a>

            </div>

        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">

            <div>
                <h2 class="text-3xl text-amber-50 font-bold">
                    Dashboard
                </h2>

                <p class="text-gray-500">
                    Manage your products and inventory
                </p>
            </div>

            <button
                id="addProductBtn"
                class="bg-blue-400 hover:bg-blue-500 text-black px-5 py-2 rounded-lg">
                + Add Product
            </button>

        </div>

        <!-- Stats -->
        <div class="grid md:grid-cols-4 gap-6 mb-8">

            <div class="bg-zinc-800 text-amber-50 rounded-lg shadow p-5">

                <p class="text-sm text-gray-400">
                    Total Products
                </p>

                <h3
                    id="totalProducts"
                    class="text-3xl font-bold mt-2">
                    0
                </h3>

            </div>

            </div>

        </div>

        <!-- Main Grid -->
        <div class="grid lg:grid-cols-3 gap-8">

            <!-- Products -->
            <div class="lg:col-span-2 bg-zinc-800 rounded-lg shadow">

                <div class="border-b px-6 py-4">

                    <h3 class="font-bold text-amber-50 text-lg">
                        Products
                    </h3>

                    <p class="text-gray-400 text-sm">
                        Manage your catalog
                    </p>

                </div>

                <div class="overflow-x-auto">

                    <table class="w-full">

                        <thead class="bg-zinc-700">

                            <tr class="text-amber-50">

                                <th class="text-left p-4">Product</th>
                                <th class="text-left p-4">Category</th>
                                <th class="text-right p-4">Price</th>
                                <th class="text-right p-4">Stock</th>
                                <th class="text-center p-4">Rating</th>
                                <th class="text-center p-4">Actions</th>

                            </tr>

                        </thead>

                        <tbody id="productTable">

                            <tr>

                                <td colspan="6"
                                    class="text-center p-10 text-gray-500">

                                    Loading products...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

            <!-- Activity -->
            <div class="bg-zinc-800 rounded-lg shadow">

                <div class="border-b px-6 py-4">

                    <h3 class="font-bold text-amber-50 text-lg">
                        Recent Activity
                    </h3>

                    <p class="text-gray-400 text-sm">
                        Latest changes
                    </p>

                </div>

                <div
                    id="activityLog"
                    class="p-6 space-y-4">

                    <p class="text-gray-400">
                        No activity yet.
                    </p>

                </div>

            </div>

        </div>

    </main>

    <!-- Product Modal -->
    <div
        id="productModal"
        class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-5 z-50">

        <div class="bg-zinc-800 rounded-xl w-full max-w-lg">

            <div class="border-b border-amber-50 p-5">

                <h2
                    id="modalTitle"
                    class="text-xl text-amber-50 font-bold">

                    Add Product

                </h2>

            </div>

            <form
                id="productForm"
                class="p-6   text-amber-50 space-y-4">

                <input
                    id="title"
                    class="w-full border  text-amber-50 rounded p-3"
                    placeholder="Product Name"
                    required>

                <textarea
                    id="description"
                    class="w-full border rounded p-3"
                    placeholder="Description"
                    rows="3"
                    required></textarea>

                <div class="grid grid-cols-2 gap-4">

                    <input
                        id="price"
                        type="number"
                        class="border rounded p-3"
                        placeholder="Price"
                        required>

                    <input
                        id="stock"
                        type="number"
                        class="border rounded p-3"
                        placeholder="Stock"
                        required>

                </div>

                <input
                    id="category"
                    class="w-full border rounded p-3"
                    placeholder="Category">

                <div class="flex justify-end gap-3">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="px-5 py-2 rounded bg-zinc-900">

                        Cancel

                    </button>

                    <button
                        type="submit"
                        class="px-5 py-2 rounded bg-blue-400 hover:bg-blue-500 text-black">

                        Save Product

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
