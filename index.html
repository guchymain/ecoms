<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSphere</title>
  <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-black min-h-screen flex items-center justify-center">

  <main class="w-full max-w-2xl px-6 py-16">
    <div class="space-y-12 text-center">

      <!-- Header -->
      <div class="space-y-4">
        <h1 class="text-5xl font-bold tracking-tight text-amber-50">
          ShopSphere
        </h1>
        <p class="text-xl text-gray-400">
          A comprehensive e-commerce platform 
        </p>
      </div>

      <!-- Buttons -->
      <div class="grid gap-6 md:grid-cols-2">

        <!-- Storefront -->
        <a href="./storefront.html" class="block">
          <button
            class="w-full h-16 bg-blue-400 hover:bg-blue-500  rounded-lg text-lg font-medium flex items-center justify-center gap-3 transition duration-200">

            <!-- Shopping Cart Icon -->
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2"
                 class="w-5 h-5">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>

            Customer Storefront
          </button>
        </a>

        <!-- Admin -->
        <a href="./admin.html" class="block">
          <button
            class="w-full h-16 bg-orange-400 hover:bg-orange-500  rounded-lg text-lg font-medium flex items-center justify-center gap-3 transition duration-200">

            <!-- Bar Chart Icon -->
            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2"
                 class="w-5 h-5">
              <line x1="12" y1="20" x2="12" y2="10"></line>
              <line x1="18" y1="20" x2="18" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>

            Admin Dashboard
          </button>
        </a>

      </div>

      <!-- Features -->
      <div class="pt-8 border-t border-gray-200">
        <div class="grid gap-8 text-left md:grid-cols-2">

          <div>
            <h3 class="font-semibold text-amber-50 mb-2">
              Storefront
            </h3>
            <p class="text-sm text-gray-400">
              Browse products, search, filter by category, and view detailed
              product information.
            </p>
          </div>

          <div>
            <h3 class="font-semibold text-amber-50 mb-2">
              Admin Panel
            </h3>
            <p class="text-sm text-gray-400">
              Manage products, track inventory, create new items, and monitor
              activity.
            </p>
          </div>

          <!-- <div>
            <h3 class="font-semibold text-gray-900 mb-2">
              Full-Stack
            </h3>
            <p class="text-sm text-gray-600">
              Built with Next.js, React Context, and responsive design
              patterns.
            </p>
          </div> -->

        </div>
      </div>

    </div>
  </main>

</body>
</html>
